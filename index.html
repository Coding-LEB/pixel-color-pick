<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AF Color Picker</title>

    <style>
      :root {
        --boot-background: #101116;
        --boot-surface: #191a21;
        --boot-text: #f4f5f7;
        --boot-muted: #969bad;
        --boot-primary: #5b5ce2;
        --boot-secondary: #8b5cf6;
        --boot-logo-background: #f7f5ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background:
                radial-gradient(
                        circle at 50% 35%,
                        rgba(91, 92, 226, 0.22),
                        transparent 32%
                ),
                var(--boot-background);
        color: var(--boot-text);
        font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
      }

      .app-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app-boot-content {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .app-boot-logo-wrap {
        width: 170px;
        height: 170px;
        display: grid;
        place-items: center;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.05);
        box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        animation: boot-float 2s ease-in-out infinite;
      }

      .app-boot-logo {
        width: 148px;
        height: 148px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border-radius: 27px;
        background: var(--boot-logo-background);
        box-shadow: 0 14px 34px rgba(91, 92, 226, 0.35);
        animation: boot-pulse 2s ease-in-out infinite;
      }

      .app-boot-logo-name {
        color: var(--boot-primary);
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -5px;
        line-height: 0.9;
      }

      .app-boot-logo-wordmark {
        margin-top: 5px;
        color: var(--boot-secondary);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .app-boot-title {
        margin: 8px 0 0;
        color: var(--boot-text);
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .app-boot-text {
        margin: 6px 0 0;
        color: var(--boot-muted);
        font-size: 13px;
      }

      .app-boot-credit {
        margin: 4px 0 0;
        color: rgba(150, 155, 173, 0.7);
        font-size: 11px;
        font-weight: 600;
      }

      .app-boot-bar {
        position: relative;
        width: 190px;
        height: 5px;
        overflow: hidden;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
      }

      .app-boot-bar::after {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(
                90deg,
                #5b5ce2,
                #8b5cf6,
                #22d3ee,
                #5b5ce2
        );
        content: "";
        animation: boot-bar 1.1s ease-in-out infinite alternate;
      }

      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.045);
        }
      }

      @keyframes boot-bar {
        0% {
          transform: translateX(-260%);
        }

        100% {
          transform: translateX(170%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-logo-wrap,
        .app-boot-logo,
        .app-boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-boot">
        <div class="app-boot-content">
          <div class="app-boot-logo-wrap">
            <div class="app-boot-logo">
              <div class="app-boot-logo-name">AF</div>
              <div class="app-boot-logo-wordmark">COLOR PICKER</div>
            </div>
          </div>

          <div>
            <p class="app-boot-title">AF Color Picker</p>
            <p class="app-boot-text">Preparing your color workspace</p>
            <p class="app-boot-credit">Made by AF Forge</p>
          </div>

          <div class="app-boot-bar"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
